# ViaObras — ambiente de containers (desenvolvimento/homologação)
# Uso: cp .env.example .env  (preencha as senhas)  &&  docker compose up -d --build
# Nenhum segredo possui valor padrão: variáveis obrigatórias usam ${VAR:?mensagem}.

name: viaobras

services:
  api:
    build:
      context: ../viaobras-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ViaObras
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?defina APP_KEY (php artisan key:generate --show)}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: pt_BR
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-viaobras}
      DB_USERNAME: ${MYSQL_USER:-viaobras}
      DB_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      API_TOKEN_MAX_DAYS: ${API_TOKEN_MAX_DAYS:-90}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      LOG_CHANNEL: stderr
      # envio de e-mail (recuperação de senha e convites). Sem MAIL_MAILER, os e-mails só vão para o registro (log).
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtps}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ViaObras}
    volumes:
      # arquivos enviados (documentos e anexos privados): sem o volume, recriar o contêiner os apagaria
      - api_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]

  web:
    build:
      context: ../viaobras-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-viaobras}
      MYSQL_USER: ${MYSQL_USER:-viaobras}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Só loopback: o Docker ignora o UFW, então a porta não pode ficar pública.
      # Em servidor com proxy reverso (nginx do host + HTTPS), ele aponta para esta porta.
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend, backend]

volumes:
  mysql_data:
  redis_data:
  api_storage:

networks:
  frontend:
  backend:
